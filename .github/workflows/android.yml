name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease karooManifest 2>&1 | tee build.log || {
            # Surface compiler and Gradle errors as annotations (readable without log access)
            grep -E '^e: |error:|What went wrong|FAILURE|Could not|^> [^T]|FAILED|AssertionError|expected:<|Exception' build.log | grep -v '^> Task' | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Inspect APK
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APK=android/app/build/outputs/apk/release/app-release.apk
          $AAPT2 dump badging $APK | grep -E "^package|sdkVersion|uses-permission|launchable" | while IFS= read -r l; do echo "::notice title=badging::$l"; done
          $AAPT2 dump xmltree --file AndroidManifest.xml $APK | grep -E "E: (service|activity|action|meta-data)|A: android:name|A: android:resource" | tr -s ' ' | head -30 | while IFS= read -r l; do echo "::notice title=manifest::$l"; done
          ls -la $APK

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/karoo-live.apk
          cp android/app/build/outputs/karoo/manifest.json dist/manifest.json
          cp android/app/karoo-live.png dist/karoo-live.png
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-live-apk
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/karoo-live.apk dist/manifest.json dist/karoo-live.png \
            --title "Karoo Live ${GITHUB_REF_NAME}" \
            --notes "Install \`karoo-live.apk\` on your Karoo. Setup guide: https://github.com/madooroy/karoo-live#readme"
